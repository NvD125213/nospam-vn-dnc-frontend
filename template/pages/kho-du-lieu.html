      <article class="work" id="inventory-telco">
        <h3>Cập nhật thuê bao giữ số đổi mạng</h3>
        <div class="work-copy">
          <p>
            Cập nhật nhà mạng mới khi thuê bao chuyển mạng nhưng giữ nguyên số.
          </p>
          <dl class="mean">
            <div>
              <dt>Số thuê bao</dt>
              <dd>Số cần cập nhật nhà mạng.</dd>
            </div>
            <div>
              <dt>Nhà mạng mới</dt>
              <dd>
                Viettel, MobiFone, VinaPhone, Vietnamobile, GTel, iTel.
              </dd>
            </div>
          </dl>
        </div>
        <form
          class="sheet clay"
          data-endpoint="/integrate/inventory/update-telco"
          data-type="json">
          <label
            >Số thuê bao
            <input
              class="field"
              name="phoneNumber"
              inputmode="tel"
              required
              placeholder="0900000000" />
          </label>
          <label
            >Nhà mạng mới
            <select class="field" name="telPartnerCodeUpdate" required>
              <option value="VIETTEL">Viettel</option>
              <option value="MOBIFONE">MobiFone</option>
              <option value="VINAPHONE">VinaPhone</option>
              <option value="VIETNAM MOBILE">Vietnamobile</option>
              <option value="GTEL">GTel</option>
              <option value="ITEL">iTel</option>
            </select>
          </label>
          <button class="btn solid" type="submit">Cập nhật</button>
        </form>
      </article>
    </div>
  </div>
